global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: firewall-analytics

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: analytics-vm
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: openwrt
    scrape_interval: 30s
    scrape_timeout: 25s
    params:
      "collect[]":
        - conntrack
        - cpu
        - entropy
        - ethtool
        - filefd
        - hwmon
        - loadavg
        - meminfo
        - nat_traffic
        - netclass
        - netstat
        - nft_counters
        - openwrt
        - selinux
        - thermal
        - time
        - uname
    static_configs:
      - targets: ["__ROUTER_ADDRESS__:__ROUTER_EXPORTER_PORT__"]
        labels:
          router: __ROUTER_LABEL__

  - job_name: openwrt-realtime
    scrape_interval: 1s
    scrape_timeout: 900ms
    params:
      "collect[]":
        - netdev
    static_configs:
      - targets: ["__ROUTER_ADDRESS__:__ROUTER_EXPORTER_PORT__"]
        labels:
          router: __ROUTER_LABEL__
    metric_relabel_configs:
      - target_label: job
        replacement: openwrt

  - job_name: openwrt-detail
    scrape_interval: 5s
    scrape_timeout: 4s
    params:
      "collect[]":
        - nlbwmon
        - mwan3
        - netify
        - device_inventory
        - wan_apps
        - wan_devices
    static_configs:
      - targets: ["__ROUTER_ADDRESS__:__ROUTER_EXPORTER_PORT__"]
        labels:
          router: __ROUTER_LABEL__
    metric_relabel_configs:
      - target_label: job
        replacement: openwrt
