# Local-only Netify DPI configuration for the OpenWrt analytics stack.
# Cloud sink/upload is intentionally disabled. Flow JSON remains on the router.

[netifyd]
enable_sink = no
json_save = yes
dns_hinting = yes
max_detection_pkts = 25

[socket]
listen_path[0] = /var/run/netifyd/netifyd.sock

[protocols]
all = include
